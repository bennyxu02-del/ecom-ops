# 预警规则库。阈值参数取自品类配置；coef 为生命周期阈值系数（见 tiering.yaml）
# 观测窗口：近 7 日 vs 前 7 日（R01）；近 3 日日均 vs 前 28 天基线（R02/R03/R08）
rules:
  - id: R01
    name: GMV 下滑
    type: 阈值
    condition: 近 7 日 GMV 较前 7 日下降 ≥ gmv_drop × coef
    severity: 下降 ≥ gmv_drop_red × coef 为红，≥ gmv_drop_yellow × coef 为黄
    cause_hint: 需诊断
  - id: R02
    name: 访客异常
    type: 统计
    condition: 近 3 日日均访客相对 28 天基线 z ≤ −z_threshold × coef
    severity: 黄
    cause_hint: 需诊断
  - id: R03
    name: 转化率异常
    type: 统计
    condition: 近 3 日支付转化率相对 28 天基线 z ≤ −z_threshold × coef
    severity: 黄
    cause_hint: 需诊断
  - id: R04
    name: 规格断货
    type: 阈值
    condition: 任一规格库存 = 0，且基准销量占比 ≥ stockout_share_min
    severity: 占比 ≥ 30% 为红，否则黄
    cause_hint: stockout
  - id: R05
    name: 断货风险
    type: 预测
    condition: 任一规格库存可售天数 < replenish_lead_days
    severity: 低于补货周期一半为红，否则黄
    cause_hint: stockout_risk
  - id: R06
    name: 价格劣势
    type: 阈值
    condition: 价格指数 > 1 + price_gap，持续 ≥ 2 天
    severity: 黄
    cause_hint: price_disadvantage
  - id: R07
    name: 口碑下滑
    type: 阈值
    condition: 评分较前 28 天均值下降 ≥ rating_drop，或近 7 日退款率 > 基线 × 1.5
    severity: 黄
    cause_hint: reputation_drop
  - id: R08
    name: 增长机会
    type: 统计
    condition: 近 3 日日均访客或 GMV 相对基线 z ≥ +z_threshold × coef
    severity: 蓝
    cause_hint: growth_opportunity

extra:
  - 爆品触发的黄色 R01 / R03 升级为红色
  - 断货（R04）结合在途补货：事件表里有该规格之后到货的补货时，写明在途数量和到货日；3 天内到货的红色降为黄色
  - 断货风险（R05）结合在途补货：到货前库存够卖的降为蓝色提示，不够卖的写明到货前还会断几天
  - 只有「增长机会」（可以带断货风险）的问题卡算「机会」，与问题分开处理
  - 缺数据的规则不运行（如没有竞品价时 R06 不跑），预警设置页标灰并说明，避免误以为没报警就是没问题
  - 基线计算剔除事件表中标记的大促日（promo_day）
  - 统计型规则要求基线期内至少 14 天有数据，否则只跑阈值规则

merge:
  - 同一商品同一天触发的规则合并为一张问题卡，严重度取最高
  - 已有未关闭问题卡的商品次日继续触发时，只更新持续天数与最新指标
  - 连续 3 天不再触发任何规则，且对应指标回到出问题前的水平（首次触发前 7 天日均的 recover_ratio，默认 95%），才标记为「已恢复」；指标没回来说明低位成了新常态，问题卡保持打开
  - 影响金额下限：只触发「量」的下滑（GMV / 访客 / 转化）且近 7 天影响低于 min_impact（默认 3,000 元）的问题卡不单独出卡
  - 长尾商品只监控断货类规则（tail_stock_only）
  - 活动结束或大促后 10 天内、只触发 GMV / 访客下滑的问题卡属于预期内：降为蓝色，自动按「已知原因」关闭
  - 被忽略的问题卡，同一商品同类规则 ignore_silence_days（默认 7）天内不再提醒，除非严重度升级
  - 处理状态只跟决定走：待决定 → 转待办（处理中）/ 已知原因、忽略（已关闭）/ 先观察 1、3、7 天（观察中）；待办复盘有效 → 已解决，无效或取消 → 回到待决定
  - 每天一条「今日预警」汇总推送到飞书：只列新增、升级、重新回到待决定的预警，做过决定的不再推送
