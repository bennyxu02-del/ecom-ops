# 指标字典：平台与 Skill 共用的唯一口径来源
# 所有窗口类指标都先对分子、分母分别求和，再相除；不对日比率求平均。
metrics:
  - id: gmv
    name: GMV（支付金额）
    unit: 元
    formula: Σ 支付订单实付金额
    note: 按支付时间归日；不含运费；不扣退款（退款单独统计）
  - id: uv
    name: 访客数
    unit: 人
    formula: 商品详情页按日去重访客
    note: 多日汇总为日访客之和，不跨日去重
  - id: buyers
    name: 支付买家数
    unit: 人
    formula: 按日去重的支付用户
    note: 多日汇总为日买家之和
  - id: units
    name: 支付件数
    unit: 件
    formula: Σ 支付件数
  - id: cvr
    name: 支付转化率
    unit: "%"
    formula: buyers ÷ uv
    note: 分子分母均为窗口内汇总值
  - id: aov
    name: 客单价
    unit: 元
    formula: gmv ÷ buyers
  - id: unit_price
    name: 件单价
    unit: 元
    formula: gmv ÷ units
  - id: units_per_buyer
    name: 人均件数
    unit: 件
    formula: units ÷ buyers
  - id: refund_rate
    name: 退款率
    unit: "%"
    formula: 退款金额 ÷ gmv
    note: 按退款发生日归日
  - id: variant_share
    name: 规格销量占比
    unit: "%"
    formula: 规格件数 ÷ 商品件数
    note: 基准取前 28 天中该规格有货的日子，避免断货拉低基准
  - id: stockout_days
    name: 断货天数
    unit: 天
    formula: 规格日终可售库存 = 0 且当日销量 = 0 的天数
  - id: days_of_supply
    name: 库存可售天数
    unit: 天
    formula: 当前库存 ÷ 近 7 日日均销量
    note: 销量为 0 时记为「充足」
  - id: price
    name: 到手价
    unit: 元
    formula: 当日标价减去常规优惠后的成交价
  - id: price_index
    name: 价格指数
    unit: ""
    formula: 到手价 ÷ 对标竞品到手价
    note: 大于 1 表示比竞品贵
  - id: rating
    name: 评分
    unit: 分
    formula: 近 30 天评价均分（5 分制）
  - id: margin
    name: 毛利率
    unit: "%"
    formula: (到手价 − 成本价) ÷ 到手价
  - id: uv_channel
    name: 渠道访客
    unit: 人
    formula: 各渠道访客数
    note: 各渠道之和 = uv
  - id: health_score
    name: 健康度
    unit: 分
    formula: 销售趋势 30 + 转化 20 + 库存 20 + 价格 15 + 口碑 15
    note: 缺少分项数据时按剩余满分折算为百分制

channels:
  search: 搜索
  recommend: 推荐
  paid: 付费投放
  campaign: 活动会场
  external: 站外
