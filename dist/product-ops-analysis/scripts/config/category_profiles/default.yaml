# 通用默认配置：数据中的品类匹配不到专属配置时使用
id: default
name: 通用消费品
new_product_days: 30
growth_days: 90
margin_high: 0.35            # 利润品毛利率门槛（仅用于分层）
gmv_drop_yellow: 0.12
gmv_drop_red: 0.20
z_threshold: 2.0
baseline_days: 28
replenish_lead_days: 7
price_gap: 0.05
stockout_share_min: 0.15
rating_drop: 0.1
factor_priority: [stock, price, rating, campaign]
action_prefs:
  price_actions: [store_coupon, gift, bundle_discount, price_match]
  gifts:
    - {name: 小赠品, cost: 5, value: 15}
  enabled_optional: []       # 品类专属动作，默认不启用
seasonality_note: 无

# 经营约束：决定方案能否在企业内执行。演示为示例值，落地时按公司规则设置。
constraints:
  margin_floor: 0.25         # 毛利底线：价格类方案执行后毛利率不得低于此值
  price_authority: 0.10      # 运营自主调价权限：单次到手价降幅上限，超出时方案给出风险提示
  min_price_window: 90       # 最低价保护：到手价低于近 N 天最低成交价（含大促价）时提示破价风险
  safety_days: 7             # 安全库存天数
  campaign_signup_lead: 7    # 活动需提前报名的天数

# 复盘：跟踪指标朝目标方向变化达到该幅度，建议判定为「有效」
review_threshold: 0.03

# 报告：三个报告场景的判断标准（分析剧本见 methods/playbooks/）。演示为建议默认值，可按公司口径调整。
report:
  flat_band: 0.05               # 周度：大盘环比在 ±5% 内且没有预警 = 平稳
  cover_share: 0.80             # 周度：「变化从哪来」要逐个解释的商品，覆盖总波动的比例
  max_items: 6                  # 周度：逐个解释的商品最多几个
  main_factor_share: 0.30       # 拆解：贡献占比 ≥ 30% 的因子为主因
  trend_weeks: 8                # 周度：大盘趋势看近几周
  structure_weeks: 4            # 周度：商品结构看近几周
  campaign_pre_days: 21         # 活动：活动前基线取多少天（避开其他大促日）
  campaign_post_days: 7         # 活动：活动后观察多少天
  campaign_main_share: 0.50     # 活动：会场带来的成交占增量 ≥ 50% = 活动是增长主力
  campaign_other_band: 0.05     # 活动：其他商品日均变化在 ±5% 内 = 没有挤占也没有带动
  festival_cover_days: 3        # 活动：节日相关的会场应覆盖到节前几天
  worsening_days: 3             # 单品：近 N 天比本周前几天更差 = 在恶化
  extra_chart_limit: 3          # 每份报告 AI 最多补充几张图

# 预警：降噪与恢复判断（预警设置页可调整）
alert:
  min_impact: 3000              # 只触发「量」的下滑（GMV / 访客 / 转化）且预计一周影响低于这个金额（元）时，不单独出预警
  tail_stock_only: true         # 长尾商品只监控断货类规则
  recover_ratio: 0.95           # 规则不再触发后，指标回到出问题前（首次触发前 7 天）的 95% 以上才算恢复
  ignore_silence_days: 7        # 忽略后同一商品同一规则静默几天（严重度升级除外）
