# 商品分层与生命周期（按近 28 天数据计算，按顺序匹配，先匹配先得）
window_days: 28
tiers:
  - id: hero
    name: 爆品
    rule: GMV 降序累计占比处于前 50%
    focus: true
  - id: rising
    name: 潜力品
    rule: 上市天数 ≤ growth_days，且 GMV 较前 28 天增长 ≥ 30%
    growth_min: 0.30
    focus: true
  - id: profit
    name: 利润品
    rule: 毛利率 ≥ margin_high，且 GMV 累计占比处于 50%–85%
    cum_share_range: [0.50, 0.85]
    focus: true
  - id: tail
    name: 长尾品
    rule: 其余商品
    focus: false

lifecycles:
  - id: new
    name: 新品期
    rule: 上市天数 < new_product_days
    coef: 2.0
  - id: growth
    name: 成长期
    rule: 上市天数 < growth_days，且 GMV 较前 28 天增长 ≥ 10%
    growth_min: 0.10
    coef: 1.5
  - id: decline
    name: 衰退期
    rule: 上市天数 ≥ 180，且 GMV 较前 28 天下降 ≥ 20%
    coef: 1.2
  - id: mature
    name: 成熟期
    rule: 其余
    coef: 1.0
# coef：预警阈值系数，作用于 R01 的百分比阈值与 R02 / R03 / R08 的 z 值阈值。
# 同样下降 10%，对新品是正常波动，对成熟爆品是严重问题。
